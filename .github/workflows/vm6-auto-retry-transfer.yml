name: VM6 Auto Retry Transfer 20260918
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vm6-transfer-retry:
    runs-on: ubuntu-latest
    steps:
      - name: Fail first attempt only
        shell: bash
        run: |
          echo "VM6_TRANSFER_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
          if [ "${GITHUB_RUN_ATTEMPT}" = "1" ]; then
            echo 'VM6_TRANSFER_FAIL_FIRST=1'
            exit 1
          fi
          echo 'VM6_TRANSFER_RETRY_SUCCESS=1'
