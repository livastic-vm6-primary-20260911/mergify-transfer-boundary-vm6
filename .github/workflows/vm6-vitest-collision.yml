name: VM6 Vitest Collision
on:
  pull_request:

permissions:
  contents: read

jobs:
  vm6-vitest-control:
    name: vm6-vitest-control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable && corepack pnpm install --no-frozen-lockfile
      - name: Plain Vitest control
        run: corepack pnpm exec vitest run good.test.mjs bad.test.mjs

  vm6-vitest-collision:
    name: vm6-vitest-collision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable && corepack pnpm install --no-frozen-lockfile
      - name: Production-backed Mergify quarantine run
        env:
          MERGIFY_TOKEN: ${{ github.token }}
          MERGIFY_API_URL: https://api.mergify.com
        run: corepack pnpm exec vitest run -c vitest.mergify.config.mjs
